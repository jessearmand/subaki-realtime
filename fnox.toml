default_provider = "ElevenLabs"

[providers.ElevenLabs]
type = "keychain"
service = "elevenlabs"

[providers.xai]
type = "keychain"
service = "fnox"

[providers.openai]
type = "keychain"
service = "fnox"

[providers.anthropic]
type = "keychain"
service = "fnox"

[providers.mistral]
type = "keychain"
service = "fnox"

[providers.huggingface]
type = "keychain"
service = "fnox"

[providers.fal]
type = "keychain"
service = "fnox"

[providers.google]
type = "keychain"
service = "fnox"

[providers.tinker]
type = "keychain"
service = "fnox"

[secrets]
ELEVENLABS_API_KEY= { provider = "ElevenLabs", value = "ELEVENLABS_API_KEY" }
XAI_API_KEY= { provider = "xai", value = "XAI_API_KEY" }
OPENAI_API_KEY= { provider = "openai", value = "OPENAI_API_KEY" }
MISTRAL_API_KEY= { provider = "mistral", value = "MISTRAL_API_KEY" }
HF_TOKEN= { provider = "huggingface", value = "HF_TOKEN" }
FAL_API_KEY= { provider = "fal", value = "FAL_API_KEY" }
GEMINI_API_KEY= { provider = "google", value = "GEMINI_API_KEY" }
TINKER_API_KEY= { provider = "tinker", value = "TINKER_API_KEY" }

# Remote-control / CI only. Kept out of [secrets] so `fnox exec -- claude` in a
# normal dev shell keeps using the Claude Max keychain login instead of this
# token — an OAuth token in the env overrides the stored session.
# Use with: fnox -P remote exec -- <cmd>
[profiles.remote.secrets]
CLAUDE_CODE_OAUTH_TOKEN= { provider = "anthropic", value = "CLAUDE_CODE_OAUTH_TOKEN" }
